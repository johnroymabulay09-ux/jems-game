<!DOCTYPE html>
<html>
<head>
  <title>Jems ATV Rush</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      text-align: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    h2 {
      margin: 10px 0 5px;
    }

    #score {
      margin: 5px;
      font-size: 18px;
      font-weight: bold;
    }

    #game {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 600px;
      margin: auto;
      overflow: hidden;
      background: #444;
      border: 4px solid #111;
      box-shadow: 0 0 25px black;
    }

    #road {
      position: absolute;
      width: 100%;
      height: 200%;
      background:
        linear-gradient(to right, #1b1b1b 0%, #333 15%, #444 50%, #333 85%, #1b1b1b 100%),
        repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 45px,
          rgba(255,255,255,0.8) 45px,
          rgba(255,255,255,0.8) 80px
        );
      animation: scrollRoad 1s linear infinite;
    }

    #road::before,
    #road::after {
      content: "";
      position: absolute;
      top: 0;
      width: 8px;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        #f5d742 0px,
        #f5d742 30px,
        transparent 30px,
        transparent 60px
      );
    }

    #road::before { left: 25px; }
    #road::after { right: 25px; }

    @keyframes scrollRoad {
      0% { top: -100%; }
      100% { top: 0%; }
    }

    #player {
      position: absolute;
      width: 90px;
      height: 90px;
      bottom: 15px;
      left: 155px;
      background-image: url("player.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      transition: left 0.12s ease;
      z-index: 5;
    }

    .enemy {
      position: absolute;
      width: 60px;
      height: 60px;
      background: linear-gradient(#ff4d4d, #b30000);
      border: 3px solid #550000;
      border-radius: 12px;
      box-shadow: 0 4px 0 #330000;
      z-index: 4;
    }

    .coin {
      position: absolute;
      width: 32px;
      height: 32px;
      background: radial-gradient(circle, #fff7a8, #ffcc00, #c79500);
      border-radius: 50%;
      border: 2px solid #7a5a00;
      z-index: 3;
      animation: spin 0.5s linear infinite;
    }

    @keyframes spin {
      0% { transform: scaleX(1); }
      50% { transform: scaleX(0.4); }
      100% { transform: scaleX(1); }
    }

    #gameOver {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 10;
      color: white;
      padding-top: 180px;
    }

    #gameOver h1 {
      color: #ff4d4d;
      font-size: 38px;
      margin-bottom: 10px;
    }

    button {
      margin: 8px;
      padding: 12px 22px;
      font-size: 18px;
      border: none;
      background: #ffcc00;
      color: #111;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.95);
    }

    .controls {
      margin-top: 8px;
    }
  </style>
</head>
<body>

<h2>🏎️ Jems ATV Rush</h2>
<p id="score">Score: 0 | Coins: 0</p>

<div id="game">
  <div id="road"></div>
  <div id="player"></div>

  <div id="gameOver">
    <h1>CRASH!</h1>
    <p id="finalScore"></p>
    <button onclick="restartGame()">Restart</button>
  </div>
</div>

<div class="controls">
  <button onclick="moveLeft()">⬅️</button>
  <button onclick="moveRight()">➡️</button>
</div>

<script>
let playerX = 155;
let enemies = [];
let coins = [];
let score = 0;
let coinCount = 0;
let gameRunning = true;
let speed = 5;
let spawnRate = 900;

const player = document.getElementById("player");
const game = document.getElementById("game");
const scoreDisplay = document.getElementById("score");
const gameOverScreen = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");

function moveLeft() {
  if (!gameRunning) return;
  playerX -= 50;
  if (playerX < 20) playerX = 20;
}

function moveRight() {
  if (!gameRunning) return;
  playerX += 50;
  if (playerX > 290) playerX = 290;
}

function spawnEnemy() {
  if (!gameRunning) return;

  enemies.push({
    x: Math.random() * 300 + 20,
    y: -70
  });
}

function spawnCoin() {
  if (!gameRunning) return;

  coins.push({
    x: Math.random() * 320 + 25,
    y: -40
  });
}

function isColliding(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

function update() {
  if (!gameRunning) return;

  game.querySelectorAll(".enemy").forEach(e => e.remove());
  game.querySelectorAll(".coin").forEach(c => c.remove());

  let playerBox = {
    x: playerX + 15,
    y: 600 - 105,
    w: 60,
    h: 75
  };

  enemies.forEach((e) => {
    e.y += speed;

    let el = document.createElement("div");
    el.className = "enemy";
    el.style.left = e.x + "px";
    el.style.top = e.y + "px";
    game.appendChild(el);

    let enemyBox = {
      x: e.x,
      y: e.y,
      w: 60,
      h: 60
    };

    if (isColliding(playerBox, enemyBox)) {
      endGame();
    }
  });

  coins.forEach((c, index) => {
    c.y += speed;

    let el = document.createElement("div");
    el.className = "coin";
    el.style.left = c.x + "px";
    el.style.top = c.y + "px";
    game.appendChild(el);

    let coinBox = {
      x: c.x,
      y: c.y,
      w: 32,
      h: 32
    };

    if (isColliding(playerBox, coinBox)) {
      coinCount++;
      score += 50;
      coins.splice(index, 1);
    }
  });

  enemies = enemies.filter(e => e.y < 650);
  coins = coins.filter(c => c.y < 650);

  score++;

  if (score % 500 === 0) {
    speed += 0.5;
  }

  scoreDisplay.innerText = "Score: " + score + " | Coins: " + coinCount;
  player.style.left = playerX + "px";

  requestAnimationFrame(update);
}

function endGame() {
  gameRunning = false;
  finalScore.innerText = "Final Score: " + score + " | Coins: " + coinCount;
  gameOverScreen.style.display = "block";
}

function restartGame() {
  location.reload();
}

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") moveLeft();
  if (e.key === "ArrowRight") moveRight();
});

document.addEventListener("touchstart", (e) => {
  let x = e.touches[0].clientX;
  if (x < window.innerWidth / 2) moveLeft();
  else moveRight();
});

setInterval(spawnEnemy, spawnRate);
setInterval(spawnCoin, 1500);

update();
</script>

</body>
</html>
